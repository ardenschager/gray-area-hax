[package]
name = "chromagrain-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Audiovisual granular sampling engine: linked audio/visual grains, key quantization, color & frequency filtering, timeline sequencing, rhai scripting"

[dependencies]
hound = "3.5"
image = { version = "0.25", default-features = false, features = ["png"] }
rhai = { version = "1.25", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
