[workspace]
resolver = "2"
members = ["crates/core", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3

# Grain rendering is hot even in dev builds; keep tests fast.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
