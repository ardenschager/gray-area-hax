[workspace]
resolver = "2"
members = ["crates/core", "crates/ui", "crates/app", "crates/plugin", "crates/ffi", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3

# Grain rendering is hot even in dev builds; keep tests fast.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# plyphon-unit with a MulAdd fix (see vendor/plyphon-unit/PATCHES.md).
[patch."https://github.com/nannou-org/plyphon"]
plyphon-unit = { path = "vendor/plyphon-unit" }

# nih-plug with a state-load fix (see vendor/nih-plug/PATCHES.md).
[patch."https://github.com/robbert-vdh/nih-plug.git"]
nih_plug = { path = "vendor/nih-plug" }
