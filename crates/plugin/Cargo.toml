[package]
name = "chromagrain-plugin"
version.workspace = true
edition.workspace = true
# GPL because of plyphon (and nih-plug's VST3 bindings).
license = "GPL-3.0-or-later"
description = "chromagrain as a VST3 / CLAP instrument: MIDI in, a playable video sampler out"

[lib]
# cdylib for the VST3/CLAP bundles, lib for tests (and a future standalone).
crate-type = ["cdylib", "lib"]

[dependencies]
chromagrain-core = { path = "../core" }
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683", features = ["assert_process_allocs"] }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683" }
rtrb = "0.3"
rfd = "0.15"

[dev-dependencies]
# The same assert_no_alloc nih-plug installs as the global allocator in
# debug builds (feature `assert_process_allocs`), so tests can fence the
# audio path.
assert_no_alloc = { git = "https://github.com/robbert-vdh/rust-assert-no-alloc.git", branch = "feature/nested-permit-forbid" }
hound = "3.5"
