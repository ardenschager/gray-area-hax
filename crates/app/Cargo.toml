[package]
name = "chromagrain"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Audiovisual granular sampling compositor / sequencer"

[dependencies]
chromagrain-core = { path = "../core" }
chromagrain-ui = { path = "../ui" }
eframe = { version = "0.32", default-features = false, features = [
    "default_fonts",
    "wgpu",
    "wayland",
    "x11",
] }
# wgpu backends (eframe pulls wgpu with none): Metal on macOS/iOS,
# D3D12/Vulkan on Windows/Linux, GLES as a fallback.
wgpu = { version = "25", default-features = false, features = ["metal", "dx12", "vulkan", "gles", "wgsl"] }
cpal = "0.15"
rtrb = "0.3"
midir = "0.10"
rfd = "0.15"
serde_json = "1"

[dev-dependencies]
pollster = "0.4"
egui_kittest = { version = "0.32", features = ["wgpu", "snapshot", "eframe"] }
# Fast PNG encoding for the showcase recorder's frames.
image = { version = "0.25", default-features = false, features = ["png"] }
