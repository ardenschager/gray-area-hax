language = "C"
include_guard = "CHROMAGRAIN_H"
autogen_warning = "/* Generated by cbindgen from crates/ffi/src/lib.rs. Do not edit. */"
header = """/*
 * chromagrain C ABI: a playable audiovisual granular sampler.
 *
 * One CgInstrument per plugin instance. Threading: cg_instrument_process,
 * the note/macro/transport setters and cg_instrument_visible_grains are
 * realtime-safe (no allocation, no locks). cg_instrument_new/free/reset,
 * cg_instrument_add_source_pcm_rgba and cg_instrument_set_key allocate:
 * call them off the audio thread, never concurrently with process.
 *
 * SPDX-License-Identifier: GPL-3.0-or-later
 */"""
cpp_compat = true
documentation = true
documentation_style = "doxy"
style = "type"
usize_is_size_t = true

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true

[export]
include = ["CgMacro", "CgScale"]
